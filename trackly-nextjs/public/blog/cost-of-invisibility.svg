<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#141233"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lost" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="won" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#6366f1" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <!-- Title -->
  <text x="600" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white" letter-spacing="1">
    The Cost of Being Invisible
  </text>

  <!-- Left: funnel of lost demand -->
  <ellipse cx="330" cy="360" rx="230" ry="200" fill="url(#glow)"/>
  <g transform="translate(330, 200)">
    <!-- Funnel stages -->
    <rect x="-190" y="0" width="380" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="33" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">AI research sessions</text>

    <rect x="-140" y="76" width="280" height="52" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="0" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Answers naming a brand</text>

    <rect x="-92" y="152" width="184" height="52" rx="6" fill="url(#lost)" stroke="#ef4444" stroke-opacity="0.5" stroke-width="1"/>
    <text x="0" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#fca5a5">Not you</text>

    <rect x="-52" y="228" width="104" height="52" rx="6" fill="#312e81" stroke="#6366f1" stroke-opacity="0.6" stroke-width="1"/>
    <text x="0" y="261" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#c7d2fe">You</text>

    <!-- Connectors -->
    <g stroke="#475569" stroke-width="1" stroke-dasharray="3,4" opacity="0.7">
      <line x1="0" y1="52" x2="0" y2="76"/>
      <line x1="0" y1="128" x2="0" y2="152"/>
      <line x1="0" y1="204" x2="0" y2="228"/>
    </g>
  </g>

  <!-- Right: cost stack -->
  <g transform="translate(700, 175)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="2">ANNUAL COST OF THE GAP</text>

    <line x1="0" y1="20" x2="0" y2="290" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="290" x2="390" y2="290" stroke="#334155" stroke-width="1"/>

    <!-- Bars: what the gap costs vs what closing it costs -->
    <rect x="40" y="45" width="110" height="245" rx="5" fill="url(#lost)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1"/>
    <text x="95" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#f87171">Lost pipeline</text>

    <rect x="230" y="222" width="110" height="68" rx="5" fill="url(#won)"/>
    <text x="285" y="211" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#818cf8">Cost to fix</text>

    <text x="95" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Invisible in AI answers</text>
    <text x="285" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Measure + fix cycle</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" letter-spacing="2">
    PUT A NUMBER ON THE ANSWERS YOU NEVER APPEAR IN
  </text>
</svg>
