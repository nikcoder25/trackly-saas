<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0e1c30"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="340" rx="400" ry="260" fill="url(#glow)"/>

  <rect x="300" y="150" width="600" height="360" rx="16" fill="#0d1928" stroke="#38bdf8" stroke-width="1" opacity="0.65"/>
  <text x="330" y="192" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="1">SHARE OF VOICE IN AI OVERVIEWS</text>

  <g font-family="system-ui, sans-serif">
    <circle cx="342" cy="232" r="14" fill="#334155"/>
    <text x="342" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">1</text>
    <text x="372" y="237" font-size="15" font-weight="600" fill="#cbd5e1">competitor-a.com</text>
    <rect x="560" y="224" width="300" height="16" rx="8" fill="#1f2937"/>
    <rect x="560" y="224" width="93" height="16" rx="8" fill="#6366f1" opacity="0.75"/>
    <text x="874" y="237" text-anchor="end" font-size="13" fill="#94a3b8">31%</text>

    <circle cx="342" cy="282" r="14" fill="#334155"/>
    <text x="342" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">2</text>
    <text x="372" y="287" font-size="15" font-weight="600" fill="#cbd5e1">review platform</text>
    <rect x="560" y="274" width="300" height="16" rx="8" fill="#1f2937"/>
    <rect x="560" y="274" width="81" height="16" rx="8" fill="#6366f1" opacity="0.75"/>
    <text x="874" y="287" text-anchor="end" font-size="13" fill="#94a3b8">27%</text>

    <circle cx="342" cy="332" r="14" fill="url(#acc)"/>
    <text x="342" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#04222a">3</text>
    <text x="372" y="337" font-size="15" font-weight="600" fill="#e2e8f0">yourbrand.com</text>
    <rect x="560" y="324" width="300" height="16" rx="8" fill="#1f2937"/>
    <rect x="560" y="324" width="39" height="16" rx="8" fill="url(#acc)" opacity="1"/>
    <text x="874" y="337" text-anchor="end" font-size="13" fill="#38bdf8">13%</text>

    <circle cx="342" cy="382" r="14" fill="#334155"/>
    <text x="342" y="387" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">4</text>
    <text x="372" y="387" font-size="15" font-weight="600" fill="#cbd5e1">everything else</text>
    <rect x="560" y="374" width="300" height="16" rx="8" fill="#1f2937"/>
    <rect x="560" y="374" width="87" height="16" rx="8" fill="#475569" opacity="1"/>
    <text x="874" y="387" text-anchor="end" font-size="13" fill="#94a3b8">29%</text>
  </g>

  <text x="330" y="452" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Mention share and citation share, tracked separately</text>
  <polyline points="330,486 400,478 470,482 540,466 610,470 680,452 750,458 820,440" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  <circle cx="820" cy="440" r="4" fill="#38bdf8"/>

  <text x="600" y="80" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="white" letter-spacing="0.5">
