<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#141233"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#6366f1" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
  </g>

  <text x="600" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white" letter-spacing="1">
    How LLM Visibility Is Measured
  </text>

  <!-- Stage 1: prompt panel -->
  <g transform="translate(70, 170)">
    <rect x="0" y="0" width="220" height="230" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
    <text x="110" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#818cf8" letter-spacing="2">STEP 1</text>
    <text x="110" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">Prompt panel</text>
    <g font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
      <text x="24" y="98">Category-defining</text>
      <text x="24" y="126">Comparison</text>
      <text x="24" y="154">Problem-led</text>
      <text x="24" y="182">Brand-led</text>
    </g>
    <g fill="#6366f1" opacity="0.8">
      <circle cx="14" cy="94" r="3"/>
      <circle cx="14" cy="122" r="3"/>
      <circle cx="14" cy="150" r="3"/>
      <circle cx="14" cy="178" r="3"/>
    </g>
    <text x="110" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">30-60 prompts, held fixed</text>
  </g>

  <!-- Stage 2: engines -->
  <ellipse cx="600" cy="285" rx="200" ry="170" fill="url(#hub-glow)"/>
  <g transform="translate(380, 170)">
    <rect x="0" y="0" width="220" height="230" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
    <text x="110" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#06b6d4" letter-spacing="2">STEP 2</text>
    <text x="110" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">Five engines</text>
    <g font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">
      <text x="24" y="92">ChatGPT</text>
      <text x="24" y="115">Claude</text>
      <text x="24" y="138">Gemini</text>
      <text x="24" y="161">Perplexity</text>
      <text x="24" y="184">Grok</text>
    </g>
    <g fill="#06b6d4" opacity="0.8">
      <circle cx="14" cy="88" r="3"/>
      <circle cx="14" cy="111" r="3"/>
      <circle cx="14" cy="134" r="3"/>
      <circle cx="14" cy="157" r="3"/>
      <circle cx="14" cy="180" r="3"/>
    </g>
    <text x="110" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Grounded + ungrounded</text>
  </g>

  <!-- Stage 3: sampling -->
  <g transform="translate(690, 170)">
    <rect x="0" y="0" width="220" height="230" rx="12" fill="url(#card)" stroke="#334155" stroke-width="1"/>
    <text x="110" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#a855f7" letter-spacing="2">STEP 3</text>
    <text x="110" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">Repeat sampling</text>
    <!-- sample dots grid: filled = mention -->
    <g transform="translate(34, 84)">
      <g fill="#334155">
        <circle cx="0" cy="0" r="8"/><circle cx="32" cy="0" r="8"/><circle cx="64" cy="0" r="8"/><circle cx="96" cy="0" r="8"/><circle cx="128" cy="0" r="8"/>
        <circle cx="0" cy="34" r="8"/><circle cx="32" cy="34" r="8"/><circle cx="64" cy="34" r="8"/><circle cx="96" cy="34" r="8"/><circle cx="128" cy="34" r="8"/>
        <circle cx="0" cy="68" r="8"/><circle cx="32" cy="68" r="8"/><circle cx="64" cy="68" r="8"/><circle cx="96" cy="68" r="8"/><circle cx="128" cy="68" r="8"/>
      </g>
      <g fill="#a855f7" opacity="0.9">
        <circle cx="0" cy="0" r="8"/><circle cx="64" cy="0" r="8"/>
        <circle cx="32" cy="34" r="8"/><circle cx="128" cy="34" r="8"/>
        <circle cx="64" cy="68" r="8"/>
      </g>
    </g>
    <text x="110" y="212" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">Non-deterministic answers</text>
  </g>

  <!-- Arrows between stages -->
  <g stroke="#475569" stroke-width="1.5" opacity="0.6">
    <line x1="296" y1="285" x2="368" y2="285" stroke-dasharray="4,4"/>
    <line x1="606" y1="285" x2="678" y2="285" stroke-dasharray="4,4"/>
  </g>

  <!-- Metrics row -->
  <g transform="translate(70, 438)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="2">FIVE METRICS, EVERY ANSWER STORED AS EVIDENCE</text>
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="200" height="56" rx="8" fill="#172033" stroke="#334155" stroke-width="1"/>
      <text x="100" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">Mention rate</text>

      <rect x="212" y="0" width="200" height="56" rx="8" fill="#172033" stroke="#334155" stroke-width="1"/>
      <text x="312" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">Share of voice</text>

      <rect x="424" y="0" width="200" height="56" rx="8" fill="#172033" stroke="#334155" stroke-width="1"/>
      <text x="524" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">Citation share</text>

      <rect x="636" y="0" width="200" height="56" rx="8" fill="#172033" stroke="#334155" stroke-width="1"/>
      <text x="736" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">Sentiment</text>

      <rect x="848" y="0" width="200" height="56" rx="8" fill="#172033" stroke="#334155" stroke-width="1"/>
      <text x="948" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#c7d2fe">Rank in answer</text>
    </g>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" letter-spacing="2">
    THE FULL LIVESOV MEASUREMENT METHODOLOGY
  </text>
</svg>
