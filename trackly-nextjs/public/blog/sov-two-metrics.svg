<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 292" width="800" height="292" role="img">
  <style>
    .bg   { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; }
    .ttl  { fill: #0f172a; font-weight: 700; }
    .lbl  { fill: #334155; }
    .mut  { fill: #64748b; }
    .trk  { fill: #e2e8f0; }
    .acc  { fill: #6366f1; }
    .acc2 { fill: #94a3b8; }
    .good { fill: #10b981; }
    .warn { fill: #f59e0b; }
    .line { stroke: #cbd5e1; }
    .accline { stroke: #6366f1; }
    text  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; }
      .ttl  { fill: #e2e8f0; }
      .lbl  { fill: #cbd5e1; }
      .mut  { fill: #94a3b8; }
      .trk  { fill: #334155; }
      .acc  { fill: #818cf8; }
      .acc2 { fill: #64748b; }
      .line { stroke: #334155; }
      .accline { stroke: #818cf8; }
    }
  </style>
  <rect width="800" height="292" rx="12" class="bg"/>
  <text x="28" y="40" class="ttl" font-size="17">Two metrics, and the gap between them is the finding</text>
  <text x="28" y="62" class="mut" font-size="13">Cited but not named means your page was read and someone else got the framing</text>
  <rect x="28" y="88" width="362" height="182" rx="10" class="card" stroke-width="1"/>
  <text x="46" y="116" class="ttl" font-size="14">Mention share of voice</text>
  <circle cx="50" cy="136" r="3" class="acc"/>
  <text x="62" y="140" class="lbl" font-size="12.5">Your brand mentions</text>
  <circle cx="50" cy="162" r="3" class="acc"/>
  <text x="62" y="166" class="lbl" font-size="12.5">over all brand mentions</text>
  <circle cx="50" cy="188" r="3" class="acc"/>
  <text x="62" y="192" class="lbl" font-size="12.5">Tells you if the summary names you</text>
  <circle cx="50" cy="214" r="3" class="acc"/>
  <text x="62" y="218" class="lbl" font-size="12.5">Moved by what the web says about you</text>
  <circle cx="50" cy="240" r="3" class="acc"/>
  <text x="62" y="244" class="lbl" font-size="12.5">Usually the higher of the two</text>
  <rect x="410" y="88" width="362" height="182" rx="10" class="card" stroke-width="1"/>
  <text x="428" y="116" class="ttl" font-size="14">Citation share of voice</text>
  <circle cx="432" cy="136" r="3" class="acc2"/>
  <text x="444" y="140" class="lbl" font-size="12.5">Your cited URLs</text>
  <circle cx="432" cy="162" r="3" class="acc2"/>
  <text x="444" y="166" class="lbl" font-size="12.5">over all cited URLs</text>
  <circle cx="432" cy="188" r="3" class="acc2"/>
  <text x="444" y="192" class="lbl" font-size="12.5">Tells you if your pages were read</text>
  <circle cx="432" cy="214" r="3" class="acc2"/>
  <text x="444" y="218" class="lbl" font-size="12.5">Moved by your own page structure</text>
  <circle cx="432" cy="240" r="3" class="acc2"/>
  <text x="444" y="244" class="lbl" font-size="12.5">The half you directly control</text>
</svg>
