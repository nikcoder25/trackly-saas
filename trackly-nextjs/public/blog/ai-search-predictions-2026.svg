<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#141233"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="trend" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="area" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#6366f1" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="290" x2="1200" y2="290"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <text x="600" y="76" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="white" letter-spacing="1">
    AI Search Predictions 2026
  </text>
  <text x="600" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8" letter-spacing="1">
    Mid-year scorecard
  </text>

  <!-- Left: scorecard rows -->
  <g transform="translate(80, 158)">
    <!-- Landed -->
    <rect x="0" y="0" width="470" height="56" rx="8" fill="#172033" stroke="#334155" stroke-width="1"/>
    <circle cx="34" cy="28" r="11" fill="#10b981" opacity="0.9"/>
    <path d="M29 28 l4 5 l8 -10" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Zero-click is the majority outcome</text>
    <text x="440" y="34" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#10b981">LANDED</text>

    <rect x="0" y="70" width="470" height="56" rx="8" fill="#172033" stroke="#334155" stroke-width="1"/>
    <circle cx="34" cy="98" r="11" fill="#10b981" opacity="0.9"/>
    <path d="M29 98 l4 5 l8 -10" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="104" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Community sources dominate citations</text>
    <text x="440" y="104" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#10b981">LANDED</text>

    <rect x="0" y="140" width="470" height="56" rx="8" fill="#172033" stroke="#334155" stroke-width="1"/>
    <circle cx="34" cy="168" r="11" fill="#6366f1" opacity="0.9"/>
    <path d="M34 162 l0 8 M34 174 l0 0" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="62" y="174" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Citation share replaces rank as KPI</text>
    <text x="440" y="174" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#818cf8">ON TRACK</text>

    <rect x="0" y="210" width="470" height="56" rx="8" fill="#172033" stroke="#334155" stroke-width="1"/>
    <circle cx="34" cy="238" r="11" fill="#ef4444" opacity="0.85"/>
    <path d="M30 234 l8 8 M38 234 l-8 8" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="62" y="244" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Tool category consolidates</text>
    <text x="440" y="244" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f87171">WRONG</text>
  </g>

  <!-- Right: forward trend chart -->
  <g transform="translate(640, 170)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="2">AI-MEDIATED RESEARCH, 2024 - 2027</text>

    <line x1="0" y1="20" x2="0" y2="250" stroke="#334155" stroke-width="1"/>
    <line x1="0" y1="250" x2="450" y2="250" stroke="#334155" stroke-width="1"/>

    <g stroke="#334155" stroke-width="0.5" opacity="0.4">
      <line x1="0" y1="77" x2="450" y2="77"/>
      <line x1="0" y1="134" x2="450" y2="134"/>
      <line x1="0" y1="192" x2="450" y2="192"/>
    </g>

    <!-- Area under the curve -->
    <path d="M20 225 L140 186 L260 118 L380 52 L380 250 L20 250 Z" fill="url(#area)"/>
    <!-- Actual to date (solid) -->
    <polyline points="20,225 140,186 260,118" fill="none" stroke="url(#trend)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Forecast (dashed) -->
    <polyline points="260,118 380,52" fill="none" stroke="#06b6d4" stroke-width="3.5" stroke-dasharray="7,6" stroke-linecap="round" opacity="0.85"/>

    <g fill="#06b6d4">
      <circle cx="20" cy="225" r="5"/>
      <circle cx="140" cy="186" r="5"/>
      <circle cx="260" cy="118" r="5"/>
    </g>
    <circle cx="380" cy="52" r="5" fill="none" stroke="#06b6d4" stroke-width="2.5"/>

    <g font-family="system-ui, sans-serif" font-size="12" fill="#64748b">
      <text x="20" y="272" text-anchor="middle">2024</text>
      <text x="140" y="272" text-anchor="middle">2025</text>
      <text x="260" y="272" text-anchor="middle">2026</text>
      <text x="380" y="272" text-anchor="middle">2027</text>
    </g>

    <text x="260" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">today</text>
    <text x="380" y="34" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#06b6d4">forecast</text>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#94a3b8" letter-spacing="2">
    NINE CALLS, SCORED AGAINST WHAT ACTUALLY HAPPENED
  </text>
</svg>
