<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 218" width="800" height="218" role="img">
  <style>
    .bg   { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #e2e8f0; }
    .ttl  { fill: #0f172a; font-weight: 700; }
    .lbl  { fill: #334155; }
    .mut  { fill: #64748b; }
    .trk  { fill: #e2e8f0; }
    .acc  { fill: #6366f1; }
    .acc2 { fill: #94a3b8; }
    .good { fill: #10b981; }
    .warn { fill: #f59e0b; }
    .line { stroke: #cbd5e1; }
    .accline { stroke: #6366f1; }
    text  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; }
      .ttl  { fill: #e2e8f0; }
      .lbl  { fill: #cbd5e1; }
      .mut  { fill: #94a3b8; }
      .trk  { fill: #334155; }
      .acc  { fill: #818cf8; }
      .acc2 { fill: #64748b; }
      .line { stroke: #334155; }
      .accline { stroke: #818cf8; }
    }
  </style>
  <rect width="800" height="218" rx="12" class="bg"/>
  <text x="28" y="40" class="ttl" font-size="17">What actually moves a Claude ranking</text>
  <text x="28" y="62" class="mut" font-size="13">Nothing in this chain is a page you can publish on Tuesday and check on Wednesday</text>
  <rect x="28" y="88" width="175" height="104" rx="10" class="card" stroke-width="1"/>
  <circle cx="48" cy="110" r="11" class="acc"/>
  <text x="48" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="44" y="140" class="ttl" font-size="13">The wider web</text>
  <text x="44" y="162" class="mut" font-size="11">Reviews, comparisons,</text>
  <text x="44" y="177" class="mut" font-size="11">docs, community threads</text>
  <path d="M205.0 135.0 l5 5 -5 5" fill="none" class="accline" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="217" y="88" width="175" height="104" rx="10" class="card" stroke-width="1"/>
  <circle cx="237" cy="110" r="11" class="acc"/>
  <text x="237" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="233" y="140" class="ttl" font-size="13">The model absorbs it</text>
  <text x="233" y="162" class="mut" font-size="11">Slowly, and not on</text>
  <text x="233" y="177" class="mut" font-size="11">your publishing schedule</text>
  <path d="M394.0 135.0 l5 5 -5 5" fill="none" class="accline" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="406" y="88" width="175" height="104" rx="10" class="card" stroke-width="1"/>
  <circle cx="426" cy="110" r="11" class="acc"/>
  <text x="426" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="422" y="140" class="ttl" font-size="13">Claude answers</text>
  <text x="422" y="162" class="mut" font-size="11">From knowledge, not</text>
  <text x="422" y="177" class="mut" font-size="11">from a live search</text>
  <path d="M583.0 135.0 l5 5 -5 5" fill="none" class="accline" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="595" y="88" width="175" height="104" rx="10" class="card" stroke-width="1"/>
  <circle cx="615" cy="110" r="11" class="acc"/>
  <text x="615" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="611" y="140" class="ttl" font-size="13">You measure it</text>
  <text x="611" y="162" class="mut" font-size="11">Weekly, over quarters,</text>
  <text x="611" y="177" class="mut" font-size="11">never over a week</text>
</svg>
